# Packaging metadata (setuptools).
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-lora"
version = "1.0.0"
description = "Local Edge LLM Fine-Tuning, Direct Preference Optimization (DPO), and Reinforcement Learning (GRPO) Engine"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0 OR MIT"}
authors = [
    {name = "SovereignLoRA Systems Team"}
]
keywords = ["llm", "lora", "qlora", "dpo", "grpo", "quantization", "gguf", "edge-ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Only torch is required at runtime for the core modules.
dependencies = [
    "torch>=2.0.0",
]

# Extras: `train` adds the Hugging Face fine-tuning stack, `dev` adds the test runner.
[project.optional-dependencies]
train = [
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.28.0",
]
dev = [
    "pytest>=7.0.0",
]

# Console entry points mapped to module:function callables.
[project.scripts]
sovereign-sft = "core.sovereign_sft_lora:main"
sovereign-grpo = "core.grpo_reward_scorer:main"
sovereign-dsce = "core.autonomous_dsce_trainer:main"
