# SovereignLoRA Recipe: Apple Silicon M-Series (M1/M2/M3/M4)
# Target: Unified Memory Architecture utilizing PyTorch Metal Performance Shaders (MPS)

# Apple Silicon shares one memory pool between CPU and GPU, so there is no separate VRAM figure.
hardware:
  platform: "darwin"
  backend: "mps"
  architecture: "Apple Silicon Unified Memory"
  recommended_unified_memory_gb: 16.0

# MPS path uses float16 rather than bfloat16.
precision:
  torch_dtype: "float16" # MPS optimized float16
  mixed_precision: "fp16"

# LoRA adapter shape: rank r and scaling lora_alpha (effective scale = alpha / r); dropout regularizes the adapter;
# target_modules lists the transformer projections that receive adapters.
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "o_proj"

# Optimization settings. effective_batch_size = micro_batch_size * gradient_accumulation_steps.
training:
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  effective_batch_size: 8
  max_seq_length: 1024
  learning_rate: 1.5e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  num_train_epochs: 3
  optimizer: "adamw_torch"
  # Recompute activations in the backward pass to trade compute for VRAM.
  gradient_checkpointing: true
  # Compute lm_head logits only where needed (see core/sovereign_sft_lora.py) to avoid a large vocab-sized activation spike.
  chunked_logits: true

# Software thermal limits enforced during training (see core/thermal_monitor.py and ThermalPacer).
thermal_governance:
  duty_cycle_enabled: true
  memory_pressure_gate_level: 2 # Level 2 = warning; throttle if reached
  duty_sleep_seconds: 3.0

# GGUF quantization types produced for llama.cpp inference after training.
export:
  target_quantizations:
    - "Q4_K_M"
    - "Q8_0"
